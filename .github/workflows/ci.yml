name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test & Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi

      #- name: Cache tool binaries
      #  id: tools-cache
      #  uses: actions/cache@v5
      #  with:
      #    path: ~/go/bin
      #    key: ${{ runner.os }}-go-tools-staticcheck-v0.7.0-gosec-v2.27.1

      - name: Install staticcheck
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Install gosec
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: Test
        run: go test ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: Gosec
        run: gosec -conf gosec.config.json ./...
